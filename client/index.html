<!DOCTYPE html>
<html lang="so">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0f7a62" />
    <meta
      name="description"
      content="Baafiye waa goob bulsho oo dadka ku nool Muqdisho ku raadiyaan alaabtii ka luntay, una soo gudbiyaan wixii ay heleen."
    />
    <meta property="og:title" content="Baafiye — Shay lumay? Raadi halkan" />
    <meta
      property="og:description"
      content="Ka raadi alaabta la helay, ama soo gudbi shay aad heshay si qofkii lahaa uu dib ugu helo."
    />
    <meta property="og:type" content="website" />
    <title>Baafiye — Raadi Alaabta Kaa Lumay</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('baafiye-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#0c1612' : '#0f7a62';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
